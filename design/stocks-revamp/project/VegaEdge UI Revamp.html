<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>VegaEdge · UI Revamp</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* VegaEdge tokens (from src/app/page.tsx + components) */
    --bg: #0b0b0d;          /* deeper than #1E1E1E — new shell */
    --bg-legacy: #1E1E1E;   /* current app bg */
    --card: #17181c;        /* new card */
    --card-legacy: #2D2D2D; /* current card */
    --line: #26272d;
    --line-soft: #1d1e23;
    --ink: #e8e8ea;
    --ink-dim: #a3a3a8;
    --ink-mute: #6b6b72;
    --green: #00C805;
    --green-dim: #0f7a12;
    --pink: #FF006E;
    --pink-dim: #8a1147;
    --gold: #FFD700;
    --gold-dim: #8a6a00;
    --blue: #4c9aff;
    --purple: #9d7aff;

    /* doc chrome */
    --paper: #fafaf8;
    --paper-ink: #17181c;
    --paper-mute: #7a7b82;
    --accent-red: #c8372d;   /* critique */
    --accent-amber: #c07a00; /* suggestion */
    --hl: #fff27a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--paper-ink); font-family: 'Inter', system-ui, sans-serif; }
  body { min-height: 100vh; }
  code, .mono { font-family: 'JetBrains Mono', monospace; }

  /* ------- doc shell ------- */
  .doc { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  aside.toc {
    background: #f2f0ec;
    border-right: 1px solid rgba(0,0,0,.08);
    padding: 22px 18px;
    position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
  }
  .brand {
    font-weight: 800; font-size: 22px; letter-spacing: -0.02em; line-height: 1;
    display: flex; align-items: baseline; gap: 6px;
  }
  .brand .v { color: var(--pink); }
  .brand .e { color: var(--ink); }
  .kicker {
    font-family: 'JetBrains Mono'; font-size: 10px; color: var(--paper-mute);
    letter-spacing: .14em; text-transform: uppercase; margin-top: 4px;
  }
  nav.toc-list { margin-top: 26px; display: flex; flex-direction: column; gap: 2px; }
  nav.toc-list a {
    padding: 7px 10px; border-radius: 4px; font-size: 13.5px; color: var(--paper-ink);
    text-decoration: none; display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; line-height: 1.2;
  }
  nav.toc-list a:hover { background: rgba(0,0,0,.05); }
  nav.toc-list a.active { background: var(--paper-ink); color: var(--paper); }
  nav.toc-list a .n {
    font-family: 'JetBrains Mono'; font-size: 10px; opacity: .6;
  }
  .toc-sec {
    font-family: 'JetBrains Mono'; font-size: 10px; color: var(--paper-mute);
    letter-spacing: .14em; text-transform: uppercase;
    padding: 14px 10px 4px;
  }
  .toc-foot {
    margin-top: 24px; padding-top: 14px; border-top: 1px dashed rgba(0,0,0,.15);
    font-size: 11px; color: var(--paper-mute); line-height: 1.55;
  }
  .toc-foot b { color: var(--paper-ink); font-weight: 600; }

  /* ------- main ------- */
  main { padding: 0; max-width: 1400px; }
  section.page {
    padding: 40px 44px 72px;
    display: none;
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  section.page.active { display: block; }

  .page-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
    margin-bottom: 18px;
  }
  .page-head h1 {
    font-family: 'Inter'; font-weight: 800; font-size: 40px; letter-spacing: -0.025em;
    margin: 0; line-height: 1.05;
  }
  .page-head h1 .route {
    font-family: 'JetBrains Mono'; font-size: 14px; font-weight: 500; color: var(--ink-mute);
    display: inline-block; margin-left: 8px; letter-spacing: 0;
    padding: 3px 8px; border: 1px solid rgba(0,0,0,.15); border-radius: 4px;
    vertical-align: 6px; background: #fff;
  }
  .page-head .breadcrumb { font-size: 11px; color: var(--paper-mute); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; font-family: 'JetBrains Mono'; }
  .page-head .meta { text-align: right; font-size: 11px; color: var(--paper-mute); line-height: 1.6; }
  .page-head .meta b { color: var(--paper-ink); font-weight: 600; }

  .lede { max-width: 780px; font-size: 16px; color: #30313a; line-height: 1.55; margin: 4px 0 28px; }
  .lede b { background: var(--hl); padding: 0 3px; }

  /* ------- critique list ------- */
  .critique {
    background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 8px;
    padding: 18px 22px; margin-bottom: 28px;
  }
  .critique h3 {
    margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--accent-red);
  }
  .critique ol { margin: 0; padding-left: 20px; }
  .critique ol > li { margin-bottom: 8px; line-height: 1.5; font-size: 14px; }
  .critique ol > li b { color: var(--paper-ink); }
  .critique .tag {
    display: inline-block; font-family: 'JetBrains Mono'; font-size: 10px;
    padding: 1px 6px; border-radius: 3px; margin-right: 6px;
    background: #f3f0ea; color: var(--accent-amber); border: 1px solid rgba(192,122,0,.25);
    letter-spacing: .05em; text-transform: uppercase; vertical-align: 1px;
  }
  .critique .tag.crit { color: var(--accent-red); border-color: rgba(200,55,45,.3); background: #fcefee; }
  .critique .tag.info { color: #2860c0; border-color: rgba(40,96,192,.25); background: #eef4fc; }

  /* ------- before/after ------- */
  .ba {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 1200px) { .ba { grid-template-columns: 1fr; } }
  .ba .frame {
    border: 1px solid rgba(0,0,0,.1); border-radius: 10px;
    overflow: hidden; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -8px rgba(0,0,0,.08);
    position: relative;
  }
  .ba .frame-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid rgba(0,0,0,.08);
    background: #fafaf7;
  }
  .ba .frame-head .label {
    font-family: 'JetBrains Mono'; font-size: 10px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--paper-mute);
  }
  .ba .frame-head .label.before { color: var(--accent-red); }
  .ba .frame-head .label.after  { color: #1f8a3a; }
  .ba .frame-head .title { font-size: 12.5px; font-weight: 600; color: var(--paper-ink); }
  .ba .frame-body { padding: 0; }
  /* scaled screen container */
  .screen {
    background: var(--bg-legacy);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }
  .screen.after {
    background: var(--bg);
    font-family: 'Inter', system-ui, sans-serif;
  }

  /* ------- legacy (before) styles — mimic the real UI ------- */
  .legacy { padding: 18px; }
  .legacy h2 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .legacy .muted { color: #a0a0a0; font-size: 11px; }
  .legacy .card { background: var(--card-legacy); border-radius: 8px; padding: 14px; margin-top: 12px; }
  .legacy .link-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
  .legacy .link-row a {
    background: var(--card-legacy); padding: 8px 12px; border-radius: 8px; color: #fff;
    text-decoration: none; font-size: 12px;
  }
  .legacy .link-row a.g { border: 1px solid rgba(0,200,5,.3); }
  .legacy .link-row a.p { border: 1px solid rgba(255,0,110,.3); }
  .legacy .link-row a.y { border: 1px solid rgba(255,215,0,.3); }
  .legacy .input {
    background: var(--card-legacy); color: #fff; padding: 7px 10px; border-radius: 6px;
    font-size: 12px; border: none; width: 90px;
  }
  .legacy .btn-g { background: var(--green); color: #fff; border: 0; padding: 8px 14px; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .legacy .table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .legacy .table th, .legacy .table td { padding: 8px 10px; border-bottom: 1px solid #3a3a3a; text-align: left; }
  .legacy .table th { color: #aaa; font-size: 10px; font-weight: 500; }
  .legacy .table td.r, .legacy .table th.r { text-align: right; font-family: 'JetBrains Mono', monospace; }
  .legacy .pill-g { color: var(--green); font-weight: 700; }
  .legacy .pill-y { color: var(--gold); font-weight: 700; }
  .legacy .pill-p { color: var(--pink); font-weight: 700; }
  .legacy .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .legacy .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .legacy .stat { background: var(--card-legacy); border-radius: 8px; padding: 10px; text-align: center; }
  .legacy .stat .k { color: #aaa; font-size: 9px; text-transform: uppercase; letter-spacing: .05em; }
  .legacy .stat .v { font-size: 18px; font-weight: 700; margin-top: 4px; }
  .legacy .badge { display: inline-block; padding: 2px 7px; font-size: 10px; font-weight: 700; border-radius: 4px; background: rgba(255,215,0,.2); color: var(--gold); letter-spacing: .04em; }
  .legacy .arch-card { background: var(--bg-legacy); border-radius: 8px; padding: 12px; }
  .legacy .arch-card h4 { font-size: 13px; font-weight: 700; margin: 0 0 6px; }
  .legacy .arch-card ul { margin: 0; padding-left: 16px; color: #cfcfcf; font-size: 11px; line-height: 1.6; }

  /* ------- revamp (after) styles ------- */
  .rv { padding: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; }
  .rv * { box-sizing: border-box; }
  .rv-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #121316 0%, #0e0f12 100%);
    gap: 16px;
  }
  .rv-brand { display: flex; align-items: center; gap: 10px; }
  .rv-brand .logo {
    width: 20px; height: 20px; border-radius: 5px;
    background: conic-gradient(from 135deg, var(--pink), var(--gold), var(--green), var(--pink));
    position: relative;
  }
  .rv-brand .logo::after { content: ""; position: absolute; inset: 3px; background: var(--bg); border-radius: 3px; }
  .rv-brand .name { font-weight: 700; font-size: 13px; letter-spacing: -0.01em; }
  .rv-brand .name span { color: var(--pink); }
  .rv-crumbs { font-family: 'JetBrains Mono'; font-size: 11px; color: var(--ink-mute); }
  .rv-crumbs b { color: var(--ink); font-weight: 500; }
  .rv-search {
    flex: 1; max-width: 360px; display: flex; align-items: center; gap: 8px;
    background: #0c0d10; border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; font-size: 12px; color: var(--ink-mute);
  }
  .rv-search .kbd {
    font-family: 'JetBrains Mono'; font-size: 10px; background: var(--line); color: var(--ink-dim);
    padding: 1px 5px; border-radius: 3px; margin-left: auto;
  }
  .rv-pills { display: flex; align-items: center; gap: 8px; }
  .rv-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-family: 'JetBrains Mono';
    padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); background: #0c0d10;
    color: var(--ink-dim);
  }
  .rv-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .rv-pill.live .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .rv-pill.paper { color: var(--gold); border-color: var(--gold-dim); background: rgba(255,215,0,.06); }
  .rv-pill.regime {
    color: var(--gold); border-color: rgba(255,215,0,.3); background: rgba(255,215,0,.08);
  }
  .rv-pill.regime.crash { color: var(--pink); border-color: rgba(255,0,110,.35); background: rgba(255,0,110,.08); }
  .rv-pill.regime.normal { color: var(--green); border-color: rgba(0,200,5,.3); background: rgba(0,200,5,.07); }
  .rv-pill.var { color: var(--ink-dim); }
  .rv-pill.var b { color: var(--ink); font-weight: 600; }

  .rv-body { display: grid; grid-template-columns: 56px 1fr; min-height: 400px; }
  .rv-rail {
    border-right: 1px solid var(--line); padding: 10px 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: #0c0d10;
  }
  .rv-rail .item {
    width: 36px; height: 32px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-mute); font-size: 10px; font-family: 'JetBrains Mono';
    cursor: pointer; position: relative;
  }
  .rv-rail .item:hover { background: var(--line-soft); color: var(--ink); }
  .rv-rail .item.active { background: #1d1e23; color: var(--ink); }
  .rv-rail .item.active::before {
    content: ""; position: absolute; left: -1px; top: 6px; bottom: 6px; width: 2px; background: var(--pink); border-radius: 2px;
  }
  .rv-rail .sep { width: 24px; height: 1px; background: var(--line); margin: 6px 0; }

  .rv-content { padding: 18px 22px; }

  .rv-h1 {
    font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 2px;
  }
  .rv-sub { font-size: 12px; color: var(--ink-mute); margin-bottom: 16px; }

  .rv-grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
  .rv-grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .rv-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .rv-kpi {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  .rv-kpi .k { font-size: 10px; color: var(--ink-mute); letter-spacing: .06em; text-transform: uppercase; font-family: 'JetBrains Mono'; }
  .rv-kpi .v { font-size: 20px; font-weight: 700; margin-top: 4px; font-family: 'JetBrains Mono'; letter-spacing: -0.01em; }
  .rv-kpi .d { font-size: 11px; margin-top: 2px; font-family: 'JetBrains Mono'; }
  .rv-kpi .d.up { color: var(--green); }
  .rv-kpi .d.dn { color: var(--pink); }

  .rv-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-top: 14px;
  }
  .rv-card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .rv-card-head h3 {
    font-size: 12px; font-weight: 600; margin: 0; letter-spacing: .05em;
    text-transform: uppercase; color: var(--ink-dim); font-family: 'JetBrains Mono';
  }
  .rv-card-head .tools { display: flex; gap: 6px; font-size: 11px; color: var(--ink-mute); }
  .rv-card-head .tools span { padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  .rv-card-head .tools span.on { background: var(--line); color: var(--ink); }

  .rv-table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono'; font-size: 11px; }
  .rv-table th, .rv-table td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  .rv-table th { color: var(--ink-mute); font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
  .rv-table td.r, .rv-table th.r { text-align: right; }
  .rv-table tbody tr:hover { background: #1a1b1f; }
  .rv-table tbody tr.sel { background: rgba(255,215,0,.06); }
  .rv-table tbody tr.sel td:first-child { border-left: 2px solid var(--gold); padding-left: 6px; }
  .rv-up { color: var(--green); }
  .rv-dn { color: var(--pink); }
  .rv-num { color: var(--ink); }

  .rv-chip {
    display: inline-block; font-family: 'JetBrains Mono'; font-size: 10px;
    padding: 1px 6px; border-radius: 3px; letter-spacing: .03em;
    border: 1px solid var(--line);
  }
  .rv-chip.buy  { color: var(--green); border-color: rgba(0,200,5,.35); background: rgba(0,200,5,.08); }
  .rv-chip.sell { color: var(--gold); border-color: rgba(255,215,0,.35); background: rgba(255,215,0,.08); }
  .rv-chip.neutral { color: var(--ink-mute); }
  .rv-chip.warn { color: var(--pink); border-color: rgba(255,0,110,.35); background: rgba(255,0,110,.08); }

  .rv-bar-h { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; position: relative; }
  .rv-bar-h > i { display: block; height: 100%; background: var(--pink); }

  .rv-ev-bar {
    position: relative; height: 14px; background: #0c0d10; border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
  }
  .rv-ev-bar::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink-mute); left: 50%; z-index: 1;
  }
  .rv-ev-bar > i { position: absolute; top: 0; bottom: 0; }
  .rv-ev-bar > i.neg { right: 50%; background: var(--pink); }
  .rv-ev-bar > i.pos { left: 50%; background: var(--green); }

  .rv-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 5px; border: 1px solid var(--line); background: #0c0d10; color: var(--ink); font-size: 12px; cursor: pointer; font-family: inherit; }
  .rv-btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 600; }
  .rv-btn.ghost { background: transparent; color: var(--ink-dim); }
  .rv-kbd { font-family: 'JetBrains Mono'; font-size: 10px; background: var(--line); color: var(--ink-dim); padding: 1px 5px; border-radius: 3px; }

  /* mini charts (SVG) */
  .rv-spark { display: block; width: 100%; height: 24px; }

  /* Greeks row */
  .rv-greeks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .rv-greek {
    background: #0c0d10; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px;
  }
  .rv-greek .sym {
    font-size: 11px; font-weight: 600; color: var(--ink-dim); font-family: 'JetBrains Mono';
    display: flex; justify-content: space-between; align-items: center;
  }
  .rv-greek .sym .ord {
    font-size: 8px; color: var(--ink-mute); padding: 0 4px; border: 1px solid var(--line); border-radius: 999px;
  }
  .rv-greek .sym .ord.o2 { color: var(--gold); border-color: rgba(255,215,0,.35); }
  .rv-greek .val { font-size: 15px; font-weight: 700; font-family: 'JetBrains Mono'; margin-top: 2px; letter-spacing: -0.01em; }
  .rv-greek .sub { font-size: 9px; color: var(--ink-mute); font-family: 'JetBrains Mono'; margin-top: 1px; }

  /* vol surface placeholder */
  .rv-surface {
    height: 160px; border-radius: 6px; border: 1px solid var(--line);
    background:
      radial-gradient(ellipse at 30% 80%, rgba(255,0,110,.35), transparent 55%),
      radial-gradient(ellipse at 75% 30%, rgba(255,215,0,.3), transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(76,154,255,.25), transparent 60%),
      linear-gradient(180deg, #0e0f12, #0a0b0e);
    position: relative;
  }
  .rv-surface svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* P&L attribution stacked bars */
  .attr-row { display: grid; grid-template-columns: 70px 1fr 60px; gap: 10px; align-items: center; font-size: 11px; font-family: 'JetBrains Mono'; }
  .attr-row .bar { height: 10px; background: var(--line); border-radius: 3px; position: relative; overflow: hidden; }
  .attr-row .bar > i { position: absolute; top: 0; bottom: 0; }

  /* log lines (auto-engine) */
  .rv-log { font-family: 'JetBrains Mono'; font-size: 11px; }
  .rv-log .row { display: grid; grid-template-columns: 90px 70px 50px 1fr; gap: 10px; padding: 5px 10px; border-bottom: 1px solid var(--line-soft); align-items: center; }
  .rv-log .t { color: var(--ink-mute); }
  .rv-log .ev { font-weight: 600; text-transform: uppercase; font-size: 10px; }
  .rv-log .ev.scan { color: var(--gold); }
  .rv-log .ev.signal { color: var(--gold); }
  .rv-log .ev.exec { color: var(--pink); }
  .rv-log .ev.skip { color: var(--ink-mute); }
  .rv-log .ev.err { color: var(--pink); }
  .rv-log .sym { color: var(--ink); }
  .rv-log .msg { color: var(--ink-dim); }

  /* chain page */
  .rv-expstrip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .rv-exp { padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: #0d0e11; cursor: pointer; }
  .rv-exp.on { border-color: var(--gold); background: rgba(255,215,0,.06); }
  .rv-exp .dte { font-family: 'JetBrains Mono'; font-size: 14px; font-weight: 700; color: var(--ink); }
  .rv-exp .date { font-size: 10.5px; color: var(--ink-mute); font-family: 'JetBrains Mono'; }
  .rv-exp .iv { font-size: 10.5px; color: var(--gold); font-family: 'JetBrains Mono'; margin-top: 4px; }
  .rv-exp .oi { font-size: 10px; color: var(--ink-mute); font-family: 'JetBrains Mono'; }

  .rv-chain-wrap { display: grid; grid-template-columns: 1fr 340px; gap: 12px; }
  .rv-chain { font-family: 'JetBrains Mono'; font-size: 10.5px; }
  .rv-chain th { background: #0d0e11; color: var(--ink-mute); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .rv-chain tbody td { padding: 3px 6px; border-bottom: 1px solid var(--line-soft); }
  .rv-chain tbody tr:hover { background: rgba(255,255,255,.02); }
  .rv-chain tbody tr.atm { border-top: 1px solid var(--blue); border-bottom: 1px solid var(--blue); background: rgba(58,141,255,.03); }
  .rv-chain tbody tr.sel { background: rgba(255,215,0,.06); }
  .rv-chain td.itm { background: rgba(255,255,255,.02); color: var(--ink); }
  .rv-chain td.strike { background: #0d0e11; color: var(--ink); font-weight: 600; }

  .rv-ticket { padding: 14px; font-size: 12px; }
  .rv-ticket-line { font-family: 'JetBrains Mono'; font-size: 13px; margin: 2px 0; }
  .rv-ticket-line.sub { font-size: 10.5px; color: var(--ink-mute); margin-bottom: 12px; }
  .rv-ticket-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 11.5px; }
  .rv-ticket-row > span:first-child { color: var(--ink-mute); }
  .rv-alt { font-size: 10.5px; color: var(--ink-dim); padding: 4px 0; font-family: 'JetBrains Mono'; }

  /* pricing page */
  .rv-slider { height: 14px; background: #0c0d10; border: 1px solid var(--line); border-radius: 3px; position: relative; margin-top: 4px; }
  .rv-slider > i { position: absolute; top: -3px; bottom: -3px; width: 4px; background: var(--gold); }
  .rv-greek-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .rv-greek-big { padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: #0d0e11; }
  .rv-greek-big.ord2 { border-color: rgba(255,215,0,.3); background: rgba(255,215,0,.03); }
  .rv-greek-big .hd { display: flex; align-items: baseline; justify-content: space-between; }
  .rv-greek-big .sym { font-family: 'JetBrains Mono'; font-size: 15px; font-weight: 700; color: var(--ink); }
  .rv-greek-big .sym .ord { font-size: 9px; color: var(--ink-mute); vertical-align: super; margin-left: 2px; }
  .rv-greek-big .nm { font-size: 10px; color: var(--ink-mute); }
  .rv-greek-big .val { font-family: 'JetBrains Mono'; font-size: 18px; font-weight: 700; color: var(--ink); margin-top: 2px; }
  .rv-greek-big .spark { height: 28px; margin: 4px 0 2px; }
  .rv-greek-big .spark svg { width: 100%; height: 100%; }
  .rv-greek-big .desc { font-size: 9.5px; color: var(--ink-mute); font-family: 'JetBrains Mono'; }
  .rv-surface { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-family: 'JetBrains Mono'; }
  .rv-surface .c { aspect-ratio: 2/1; display: flex; align-items: center; justify-content: center; font-size: 10px; border: 1px solid var(--line-soft); color: var(--ink); }
  .rv-surface-axes { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-mute); margin-top: 4px; font-family: 'JetBrains Mono'; }

  /* legend footer */
  .footnotes {
    margin-top: 24px; padding: 16px 18px; background: #fff;
    border: 1px solid rgba(0,0,0,.08); border-radius: 8px;
  }
  .footnotes h4 { margin: 0 0 8px; font-size: 13px; font-weight: 700; }
  .footnotes .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; font-size: 13px; line-height: 1.5; }
  .footnotes .grid b { color: var(--paper-ink); }
  .footnotes .grid .head { color: var(--accent-red); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .footnotes .grid .head.y { color: var(--accent-amber); }
  .footnotes .grid .head.g { color: #1f8a3a; }

  /* anchor annotations (red + arrows) */
  .annot {
    position: relative; display: inline-block;
  }
  .annot-box {
    position: absolute; background: #fff; border: 1px solid var(--accent-red);
    color: var(--accent-red); font-size: 11px; padding: 3px 7px; border-radius: 3px;
    font-family: 'Inter'; font-weight: 500; z-index: 5; line-height: 1.25;
    box-shadow: 0 2px 6px rgba(0,0,0,.1);
  }

  /* print */
  @media print {
    aside.toc { display: none; }
    section.page { display: block !important; page-break-after: always; }
    .doc { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="doc">
  <aside class="toc">
    <div class="brand"><span class="v">Vega</span><span class="e">Edge</span></div>
    <div class="kicker">UI Revamp · v1</div>

    <div class="toc-sec">Overview</div>
    <nav class="toc-list" id="nav-overview"></nav>

    <div class="toc-sec">Core flows</div>
    <nav class="toc-list" id="nav-core"></nav>

    <div class="toc-sec">Risk & Automation</div>
    <nav class="toc-list" id="nav-risk"></nav>

    <div class="toc-sec">Cross-cutting</div>
    <nav class="toc-list" id="nav-cross"></nav>

    <div class="toc-foot">
      Based on <b>iaac-poc branch</b>, 15 pages.<br/>
      Each page shows <b>Before</b> (current UI) → <b>After</b> (revamp) with critique + proposed changes.<br/><br/>
      Use <b>←/→</b> to navigate.
    </div>
  </aside>

  <main id="main"></main>
</div>

<script>
  // Page data — each entry produces one section. Content strings are HTML.
  // Rendered in order.
  const PAGES = [
    /* populated by page scripts below */
  ];
  window.__VE_PAGES = PAGES;
</script>

<!-- RV helper (shared shell + components for "After" panels) -->
<script src="pages/_rv.js"></script>

<!-- page modules -->
<script src="pages/00-overview.js"></script>
<script src="pages/01-dashboard.js"></script>
<script src="pages/02-scanner.js"></script>
<script src="pages/03-options-chain.js"></script>
<script src="pages/04-pricing.js"></script>
<script src="pages/05-portfolio.js"></script>
<script src="pages/06-auto-engine.js"></script>
<script src="pages/07-cross-cutting.js"></script>

<script>
  // Render TOC + pages
  const main = document.getElementById('main');
  const navs = {
    overview: document.getElementById('nav-overview'),
    core:     document.getElementById('nav-core'),
    risk:     document.getElementById('nav-risk'),
    cross:    document.getElementById('nav-cross'),
  };

  window.__VE_PAGES.forEach((p, i) => {
    // TOC entry
    const a = document.createElement('a');
    a.dataset.id = p.id;
    a.innerHTML = `<span>${p.nav}</span><span class="n">${String(i).padStart(2,'0')}</span>`;
    a.onclick = () => showPage(p.id);
    (navs[p.group] || navs.overview).appendChild(a);

    // Page section
    const sec = document.createElement('section');
    sec.className = 'page';
    sec.dataset.id = p.id;
    sec.setAttribute('data-screen-label', String(i).padStart(2,'0') + ' ' + p.nav);
    sec.innerHTML = p.render();
    main.appendChild(sec);
  });

  function showPage(id) {
    document.querySelectorAll('section.page').forEach(s => s.classList.toggle('active', s.dataset.id === id));
    document.querySelectorAll('aside.toc a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
    try { localStorage.setItem('ve_revamp_page', id); } catch(e) {}
    window.scrollTo({ top: 0 });
    const idx = window.__VE_PAGES.findIndex(p => p.id === id);
    window.__VE_IDX = idx;
  }

  // keyboard nav
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const idx = window.__VE_IDX ?? 0;
    if (e.key === 'ArrowRight' && idx < window.__VE_PAGES.length - 1) showPage(window.__VE_PAGES[idx+1].id);
    if (e.key === 'ArrowLeft'  && idx > 0)                             showPage(window.__VE_PAGES[idx-1].id);
  });

  // boot
  const saved = (() => { try { return localStorage.getItem('ve_revamp_page'); } catch(e){ return null; } })();
  const initial = (saved && window.__VE_PAGES.find(p => p.id === saved)) ? saved : window.__VE_PAGES[0].id;
  showPage(initial);
</script>
</body>
</html>
