---
- name: Prepare host — install Docker and Terraform
  hosts: local
  become: true
  vars:
    terraform_version: "1.9.8"
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - unzip
        state: present
        update_cache: true

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /usr/share/keyrings/docker.gpg
        state: present

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add invoking user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: true

    - name: Install Docker SDK for Python (used by Ansible docker modules)
      ansible.builtin.pip:
        name:
          - docker
          - requests
        state: present
        break_system_packages: true

    - name: Check installed Terraform version
      ansible.builtin.command: terraform version
      register: tf_version_check
      changed_when: false
      failed_when: false

    - name: Download Terraform
      ansible.builtin.unarchive:
        src: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_amd64.zip"
        dest: /usr/local/bin
        remote_src: true
        creates: /usr/local/bin/terraform
      when: "terraform_version not in (tf_version_check.stdout | default(''))"

- name: Apply Terraform stack
  hosts: local
  become: false
  vars:
    tf_dir: "{{ playbook_dir }}/../terraform"
  tasks:
    - name: Ensure terraform.tfvars exists (copy from example if missing)
      ansible.builtin.copy:
        src: "{{ tf_dir }}/terraform.tfvars.example"
        dest: "{{ tf_dir }}/terraform.tfvars"
        force: false
      when: lookup('env', 'POSTGRES_PASSWORD') == ''

    - name: Run terraform init + apply
      community.general.terraform:
        project_path: "{{ tf_dir }}"
        state: present
        force_init: true
        variables:
          postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') | default('change-me', true) }}"
          alpaca_api_key: "{{ lookup('env', 'ALPACA_API_KEY') | default('', true) }}"
          alpaca_secret_key: "{{ lookup('env', 'ALPACA_SECRET_KEY') | default('', true) }}"
          gemini_api_key: "{{ lookup('env', 'GEMINI_API_KEY') | default('', true) }}"
      register: tf_result

    - name: Show service URLs
      ansible.builtin.debug:
        msg:
          - "Frontend: {{ tf_result.outputs.frontend_url.value }}"
          - "Backend:  {{ tf_result.outputs.backend_url.value }}"
